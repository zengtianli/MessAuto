notes: |
  2026-07-25 从 ~/Dev 根归位到 ~/Apps(A 档:自带完整依赖、不 import 总部代码)。
  当前分支 feat/dingtalk-support,领先 upstream/master 4 个提交。
  上游 PR LeeeSe/MessAuto#107 状态 CLOSED(draft,未合并)—— 抢跑提了才转 draft,教训见 memory
  feedback-verify-effective-before-pr:本机构建→安装→真实场景端到端确认有效才 PR。
  钉钉这条线**禁改回 FSEvents 文件监听**:通知中心是高频 WAL 库,实测新通知不触发事件(代码注释已记)。

  ── 2026-07-28 退役 ──────────────────────────────────────────────
  **app 已从 /Applications 卸载**(在 ~/.Trash/MessAuto.app),配置与 dotfiles 条目
  一并清除(~/.Trash/messauto-residue-20260728/)。**源码仓保留在原位**。

  退役原因(实测,非体感):空闲烧 87.9% 单核、累计 1514 分钟用户态 CPU。
  sample 3005/3005 帧卡在 email crate 0.0.21 的 Rfc5322Parser::consume_header;
  且 process_file 是在 watch 循环里同步调的 —— 卡住后邮件功能整个失效,
  一边失效一边钉住一个核。

  替代品:github.com/zengtianli/otp-sh(自研,216 行 POSIX sh + launchd WatchPaths,
  零依赖,空闲 0 进程)。短信路径已端到端验证;**钉钉路径实测结构性不通** ——
  launchd WatchPaths 底层是 FSEvents,对 usernoted 容器不上报(四种目标唤醒全 0)。
  本仓的 2s 轮询恰好绕开了该限制,这也是「禁改回文件监听」那条注释的真正根因。

  **为什么是 frozen 不是 archived**:① 钉钉 fork(feat/dingtalk-support,领先上游
  4 个提交)是这份工作的唯一副本,上游 PR #107 已 CLOSED;② otp-sh 的钉钉路径
  还没用真实钉钉验证码验过。**等 otp-sh 钉钉路径验通后再转 archived 并移入 _archive/**
  (走 /refactor dir,禁裸 mv)。


